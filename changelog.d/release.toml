name = "TAVI"                       # release title prefix: "TAVI vX.Y.Z"
version_file = "tavi/__init__.py"   # holds the one __version__ = "X.Y.Z" line
test_command = "\"%LOCALAPPDATA%\\micromamba\\micromamba.exe\" run -n tavi-dev python -m pytest tests -q -ra"  # absolute launcher: micromamba is not on PATH for a subprocess
test_timeout_seconds = 900          # kills the whole process tree and reports
# Dated history that names the previous version on purpose; prepare's stray-version check skips these.
allow_old_version_paths = [
    "docs/READING_GUIDE.md",              # the row on the previous installer's handoff
    "docs/audits/release-1-4.md",         # the audit's baseline release
    "tools/support/Record-TAVI.bat",      # when installation layout 2 began
    "tests/test_installer_launchers.py",  # tests of the shipped previous installer
]
# No version number in these comments: the check would find it here too.
